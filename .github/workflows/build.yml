name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/ir/shahab/keyboard app/src/main/res/values app/src/main/res/xml app/src/main/res/drawable
          mv -f root-build.gradle.kts build.gradle.kts
          mv -f app-build.gradle.kts app/build.gradle.kts
          mv -f AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv -f method.xml app/src/main/res/xml/method.xml
          mv -f strings.xml app/src/main/res/values/strings.xml
          mv -f ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml
          mv -f MainActivity.kt SmartKeyboardService.kt Util.kt app/src/main/java/ir/shahab/keyboard/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SmartKeyboard-apk
          path: app/build/outputs/apk/debug/*.apk
